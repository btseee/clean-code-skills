name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-linux:
    name: Validate (bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run validator
        run: bash scripts/validate.sh
      - name: sync.sh is a no-op on a synced tree
        run: |
          bash scripts/sync.sh
          git diff --exit-code

  validate-windows:
    name: Validate (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run validator under Git Bash
        shell: bash
        run: bash scripts/validate.sh
      - name: Exercise install.ps1
        shell: pwsh
        run: ./scripts/validate.ps1

  python-3-8:
    name: Python 3.8 floor
    # The scripts promise Python 3.8. The validator's 3.8 grammar check runs on a newer
    # parser, which accepts some syntax 3.8 rejects, so run the real thing. Pinned because
    # 3.8 builds exist only for older runner images.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Skill scripts compile
        run: python -m compileall -q skills/clean-code/scripts

  lint-markdown:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint
        # .markdownlint.json has been in the repo since the start but nothing ran it.
        # Lint what this repository ships; vendored third-party skills are not ours to fix.
        run: >
          npx --yes markdownlint-cli2
          "**/*.md" "#books" "#node_modules" "#agent" "#.agents" "#.claude"

  skill-tools:
    name: Skill tools behave
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: detect_stack runs on this repository
        run: python skills/clean-code/scripts/detect_stack.py --root . --json > /dev/null
      - name: scan_repo runs on this repository
        run: python skills/clean-code/scripts/scan_repo.py --root . --json > /dev/null
      - name: check_boundaries reports a violation and exits non-zero
        run: |
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/.clean" "$fixture/src/domain" "$fixture/src/infra"
          printf '```clean-architecture\nlayer domain = src/domain/**\nlayer infra  = src/infra/**\n```\n' \
            > "$fixture/.clean/architecture.md"
          printf "import { Db } from '../infra/db';\n" > "$fixture/src/domain/order.ts"
          printf 'export const Db = 1;\n' > "$fixture/src/infra/db.ts"
          if python skills/clean-code/scripts/check_boundaries.py --root "$fixture"; then
            echo "expected a dependency-rule violation to fail the check" >&2
            exit 1
          fi
          printf "import { Order } from '../domain/order';\n" > "$fixture/src/infra/repo.ts"
          printf 'export const Order = 1;\n' > "$fixture/src/domain/order.ts"
          python skills/clean-code/scripts/check_boundaries.py --root "$fixture"
      - name: check_boundaries exits 2 when the declaration matches no files
        run: |
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/.clean" "$fixture/src"
          printf '```clean-architecture\nlayer domain = nomatch/**\nlayer infra  = alsonot/**\n```\n' \
            > "$fixture/.clean/architecture.md"
          printf 'export const X = 1;\n' > "$fixture/src/a.ts"
          code=0
          python skills/clean-code/scripts/check_boundaries.py --root "$fixture" || code=$?
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for a declaration matching no files, got $code" >&2
            exit 1
          fi
      - name: check_boundaries places imports the same way for paths and module names
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "skills/clean-code/scripts")
          import check_boundaries as cb
          layering = cb.parse_layering(
              "```clean-architecture\nlayer domain = src/domain/**\n"
              "layer infra = src/infra/**\nallow domain -> *\n```"
          )
          files = {"src/domain/order.py", "src/domain/order.ts", "src/infra/db.py", "src/infra/db.ts"}
          exists = files.__contains__
          cases = [
              ("src/domain/order.py", "..infra.db", "infra"),      # python relative, resolves
              ("src/domain/order.py", "..missing.thing", None),    # unresolved, no token: unknown
              ("src/domain/order.py", "app.infra.db", "infra"),    # absolute, by namespace token
              ("src/domain/order.py", "json", None),               # stdlib
              ("src/domain/order.ts", "../infra/db", "infra"),     # path relative, resolves
              ("src/domain/order.ts", "./order", "domain"),        # same layer
              ("src/domain/order.ts", "../../../etc", None),       # escapes root
              ("src/domain/order.ts", "react", None),              # third party
          ]
          for source, module, want in cases:
              got = layering.layer_of_import(module, source, exists)
              assert got == want, f"{source} imports {module}: want {want}, got {got}"
          assert layering.permits("infra", "domain"), "inward is always allowed"
          assert layering.permits("domain", "infra"), "allow domain -> * must permit outward"
          plain = cb.parse_layering("```clean-architecture\nlayer domain = src/domain/**\nlayer infra = src/infra/**\n```")
          assert not plain.permits("domain", "infra"), "outward is a violation by default"
          EOF
      - name: detect_stack --write merges instead of clobbering
        run: |
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/.clean" "$fixture/src"
          printf '{"name":"x","dependencies":{"react":"18.3.1"}}\n' > "$fixture/package.json"
          printf 'const x = 1;\n' > "$fixture/src/index.js"
          printf '{"confirmed":{"purpose":"demo"},"future_key":123}\n' > "$fixture/.clean/context.json"
          python skills/clean-code/scripts/detect_stack.py --root "$fixture" --write > /dev/null
          python - "$fixture/.clean/context.json" <<'EOF'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["confirmed"]["purpose"] == "demo", "confirmed object was clobbered"
          assert data["future_key"] == 123, "unknown key was dropped"
          assert data["primary_language"], "detector keys missing after merge"
          EOF
      - name: map_structure runs on this repository
        run: python skills/clean-code/scripts/map_structure.py --root . --json > /dev/null
      - name: map_structure flags a middleware living in a service file
        run: |
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/src/services" "$fixture/src/middleware"
          printf 'class AuthService {}\nfunction authMiddleware(req, res, next) { next(); }\nmodule.exports = { AuthService, authMiddleware };\n' \
            > "$fixture/src/services/auth.js"
          printf 'module.exports = function corsMiddleware(req, res, next) { next(); };\n' \
            > "$fixture/src/middleware/cors.js"
          python skills/clean-code/scripts/map_structure.py --root "$fixture" --json > "$fixture/map.json"
          python - "$fixture/map.json" <<'EOF'
          import json, sys
          misplaced = json.load(open(sys.argv[1], encoding="utf-8"))["findings"]["misplaced"]
          assert [item["symbol"] for item in misplaced] == ["authMiddleware"], misplaced
          assert misplaced[0]["suggestion"] == "src/middleware/", misplaced
          EOF
      - name: Eval cases are well-formed and not vacuous
        run: python evals/grade.py --self-test
