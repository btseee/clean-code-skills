name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-linux:
    name: Validate (bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validator
        run: bash scripts/validate.sh

  validate-windows:
    name: Validate (PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run validator
        shell: pwsh
        run: ./scripts/validate.ps1
