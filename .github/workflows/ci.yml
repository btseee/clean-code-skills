name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-linux:
    name: Validate (bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run validator
        run: bash scripts/validate.sh

  validate-windows:
    name: Validate (PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run validator
        shell: pwsh
        run: ./scripts/validate.ps1

  lint-markdown:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint
        # .markdownlint.json has been in the repo since the start but nothing ran it.
        # Lint what this repository ships; vendored third-party skills are not ours to fix.
        run: >
          npx --yes markdownlint-cli2
          "**/*.md" "#books" "#node_modules" "#agent" "#.agents" "#.claude"

  skill-tools:
    name: Skill tools behave
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: detect_stack runs on this repository
        run: python skills/clean-code/scripts/detect_stack.py --root . --json > /dev/null
      - name: scan_repo runs on this repository
        run: python skills/clean-code/scripts/scan_repo.py --root . --json > /dev/null
      - name: check_boundaries reports a violation and exits non-zero
        run: |
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/.clean" "$fixture/src/domain" "$fixture/src/infra"
          printf '```clean-architecture\nlayer domain = src/domain/**\nlayer infra  = src/infra/**\n```\n' \
            > "$fixture/.clean/architecture.md"
          printf "import { Db } from '../infra/db';\n" > "$fixture/src/domain/order.ts"
          printf 'export const Db = 1;\n' > "$fixture/src/infra/db.ts"
          if python skills/clean-code/scripts/check_boundaries.py --root "$fixture"; then
            echo "expected a dependency-rule violation to fail the check" >&2
            exit 1
          fi
          printf "import { Order } from '../domain/order';\n" > "$fixture/src/infra/repo.ts"
          printf 'export const Order = 1;\n' > "$fixture/src/domain/order.ts"
          python skills/clean-code/scripts/check_boundaries.py --root "$fixture"
      - name: check_boundaries exits 2 when the declaration matches no files
        run: |
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/.clean" "$fixture/src"
          printf '```clean-architecture\nlayer domain = nomatch/**\nlayer infra  = alsonot/**\n```\n' \
            > "$fixture/.clean/architecture.md"
          printf 'export const X = 1;\n' > "$fixture/src/a.ts"
          code=0
          python skills/clean-code/scripts/check_boundaries.py --root "$fixture" || code=$?
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 for a declaration matching no files, got $code" >&2
            exit 1
          fi
      - name: detect_stack --write merges instead of clobbering
        run: |
          fixture="$(mktemp -d)"
          mkdir -p "$fixture/.clean" "$fixture/src"
          printf '{"name":"x","dependencies":{"react":"18.3.1"}}\n' > "$fixture/package.json"
          printf 'const x = 1;\n' > "$fixture/src/index.js"
          printf '{"confirmed":{"purpose":"demo"},"future_key":123}\n' > "$fixture/.clean/context.json"
          python skills/clean-code/scripts/detect_stack.py --root "$fixture" --write > /dev/null
          python - "$fixture/.clean/context.json" <<'EOF'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          assert data["confirmed"]["purpose"] == "demo", "confirmed object was clobbered"
          assert data["future_key"] == 123, "unknown key was dropped"
          assert data["primary_language"], "detector keys missing after merge"
          EOF
